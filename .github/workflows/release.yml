# Apps descargables: al crear una etiqueta v* (p. ej. v1.0.0), o a mano desde la pestaña Actions,
# se compilan el APK de Android y el instalador de Windows y se adjuntan a un GitHub Release.
#
# APK firmado (opcional): si el repositorio tiene los secretos ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD, se publica el APK de release
# firmado. Si no, se publica el APK de depuración (se instala igual, pero no sirve para Google Play).
name: Apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (p. ej. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  android:
    name: APK de Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias y probar
        run: |
          npm ci
          npm test

      - name: Compilar el juego y copiarlo al proyecto Android
        run: |
          # La versión de la etiqueta también en el juego (el menú la muestra).
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
          npm run android:sync

      - name: Preparar la firma (si hay secretos)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/reticula.jks"
            echo "keystore=$RUNNER_TEMP/reticula.jks" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=APK sin firma de publicación::Se publica el APK de depuración. Añade los secretos ANDROID_KEYSTORE_* para firmarlo."
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar el APK
        working-directory: android
        env:
          VERSION_NAME: ${{ env.VERSION }}
          VERSION_CODE: ${{ github.run_number }}
          RETICULA_KEYSTORE: ${{ steps.sign.outputs.keystore }}
          RETICULA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RETICULA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RETICULA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ steps.sign.outputs.task }} --no-daemon
          mkdir -p ../out
          find app/build/outputs/apk -name '*.apk' -exec cp {} "../out/Reticula-${VERSION#v}.apk" \;

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  windows:
    name: App de Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias y probar
        run: |
          npm ci
          npm test

      - name: Compilar instalador y portable
        shell: bash
        run: |
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
          npm run desktop:build

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  release:
    name: Publicar el Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Crear o actualizar el Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION#v}"
          NOTES="Retícula ${TAG}

          - Windows: Reticula-Setup (instalador) o Reticula-Portable (sin instalar).
          - Android: Reticula-*.apk (activa «Instalar apps de origen desconocido»). Se juega con controles táctiles.
          - Navegador: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" out/* --title "Retícula $TAG" --notes "$NOTES" --target "${{ github.sha }}" --repo "${{ github.repository }}"
          fi
