appId: com.reticula.app
productName: Reticula
copyright: Retícula
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Retícula
  uninstallDisplayName: Retícula
  artifactName: Reticula-Setup-${version}.${ext}
portable:
  artifactName: Reticula-Portable-${version}.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.games
  identity: null
  artifactName: Reticula-Mac-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
dmg:
  title: Retícula
